name: Refresh + deploy dashboard

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      # Stockfish powers move quality, Blunder Analysis, and My Blunder Puzzles.
      # Puzzle candidates reuse that persisted analysis instead of starting a
      # second engine pass. Without Stockfish, cached candidates still render
      # and unanalyzed games remain pending. Ubuntu installs the binary to
      # /usr/games, which chess_tracker.puzzles.find_engine_path() discovers.
      - name: Install Stockfish
        run: sudo apt-get update && sudo apt-get install -y stockfish

      # Persist BOTH the raw archives and the move-quality analysis cache so
      # each scheduled run only fetches/analyzes games it hasn't seen. Without
      # the analysis cache here, every deploy would re-run Stockfish over the
      # whole recent window from scratch.
      - name: Cache Chess.com archives + analysis
        uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/analysis_cache.json
          key: chess-archives-${{ github.run_id }}
          restore-keys: |
            chess-archives-

      - name: Run tests
        run: uv run pytest

      - name: Refresh dashboard
        # Deploys complete the legacy PV backlog in one pass so every existing
        # non-terminal puzzle uses the two-decision continuation immediately.
        # The persisted analysis cache makes later builds incremental.
        run: uv run refresh.py --puzzle-line-max 0

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - id: deployment
        uses: actions/deploy-pages@v4
